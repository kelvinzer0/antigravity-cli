name: Release to npm

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Publish needs to write an id-token for provenance and read the repo.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Idempotent release: a push only publishes when package.json's version
      # is not already on the registry, so re-running the workflow on the same
      # commit is a no-op instead of a failure.
      - name: Check whether this version is already published
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if npm view "@kelvinzero/antigravity-cli@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is already published — skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is new — publishing."
          fi

      - name: Publish to npm
        if: steps.version.outputs.published == 'false'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        if: steps.version.outputs.published == 'false'
        run: |
          echo "### Published \`@kelvinzero/antigravity-cli@${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "https://www.npmjs.com/package/@kelvinzero/antigravity-cli" >> "$GITHUB_STEP_SUMMARY"
